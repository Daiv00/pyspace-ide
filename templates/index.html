<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PySpace IDE</title><link rel="stylesheet" href="/static/style.css?v=3"><script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script></head><body>
<div id="auth" class="auth"><div class="card"><b class="logo">◈ PySpace</b><p class="muted">Онлайн IDE • Python / HTML / CSS / SQL</p><input id="username" autocomplete="username" placeholder="Логин"><input id="password" autocomplete="current-password" type="password" placeholder="Пароль"><div class="row"><button id="loginBtn" type="button">Войти</button><button id="registerBtn" class="ghost" type="button">Создать аккаунт</button></div><div id="msg"></div></div></div>
<div id="app" class="hidden"><header><div class="brand"><button id="menuBtn" class="ghost mobile-only">☰</button><b>◈ PySpace <small>IDE</small></b></div><div class="head-actions"><span id="who"></span><button class="ghost" onclick="lan()">Общий доступ</button><button id="admin" class="ghost" onclick="admin()">Admin</button><button class="ghost" onclick="logout()">Выйти</button></div></header><div class="layout"><aside id="sidebar"><div class="sect">ПРОЕКТЫ <button onclick="newProject()">＋</button></div><div id="projects"></div><div class="sect">ФАЙЛЫ</div><div id="files"></div><div class="buttons"><button onclick="newFile()">＋ Файл</button><button onclick="uploadInput.click()">⬆ Загрузить</button><button onclick="downloadCurrent()">⬇ Скачать</button><button onclick="downloadZip()">📦 Скачать ZIP</button><button onclick="renameFile()">Переименовать</button><button onclick="deleteFile()">Удалить</button><button onclick="share()">Поделиться</button><input id="uploadInput" type="file" multiple hidden></div></aside><main><div class="tabs"><span id="tab">main.py</span><div><select id="langSelect" class="lang"><option value="python">Python</option><option value="html">HTML</option><option value="css">CSS</option><option value="sql">SQL</option><option value="javascript">JavaScript</option><option value="json">JSON</option><option value="plaintext">TXT</option></select><button class="ghost" onclick="save()">Ctrl+S</button><button class="ghost" onclick="preview()">👁 Предпросмотр</button><button class="run" onclick="run()">▶ Запустить</button></div></div><div id="editor"></div><div class="terminal"><div class="termhead">OUTPUT <button class="ghost" onclick="out('')">Очистить</button></div><pre id="out">Готово.</pre></div></main></div></div><div id="modal" class="modal hidden"><div class="modalcard"><button class="close" onclick="hide()">×</button><div id="body"></div></div></div><script src="/static/app.js?v=3"></script></body></html>
