<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PySpace IDE</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body>
<div id="auth" class="auth"><div class="card"><b class="logo">◈ PySpace</b><p class="muted">Python Web IDE • LAN Workspace</p><input id="username" placeholder="Логин"><input id="password" type="password" placeholder="Пароль"><div class="row"><button onclick="login()">Войти</button><button class="ghost" onclick="register()">Создать аккаунт</button></div><div id="msg"></div></div></div>
<div id="app" class="hidden"><header><b>◈ PySpace <small>IDE</small></b><div><span id="who"></span><button class="ghost" onclick="lan()">LAN</button><button id="admin" class="ghost" onclick="admin()">Admin</button><button class="ghost" onclick="logout()">Выйти</button></div></header><div class="layout"><aside><div class="sect">ПРОЕКТЫ <button onclick="newProject()">＋</button></div><div id="projects"></div><div class="sect">ФАЙЛЫ</div><div id="files"></div><div class="buttons"><button onclick="newFile()">＋ Файл</button><button onclick="renameFile()">Переименовать</button><button onclick="deleteFile()">Удалить</button><button onclick="share()">Поделиться</button></div></aside><main><div class="tabs"><span id="tab">main.py</span><div><button class="ghost" onclick="save()">Ctrl+S</button><button class="run" onclick="run()">▶ Запустить</button></div></div><div id="editor"></div><div class="terminal"><div class="termhead">TERMINAL <button class="ghost" onclick="out('')">Очистить</button></div><pre id="out">Готово.</pre></div></main></div></div><div id="modal" class="modal hidden"><div class="modalcard"><button class="close" onclick="hide()">×</button><div id="body"></div></div></div><script src="/static/app.js"></script></body></html>
