
<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PySpace Reminders</title><link rel="stylesheet" href="/static/style.css">
</head><body>
<header><div class="logo">◈ <b>PySpace</b><span>REMINDERS</span></div><div id="clock"></div></header>
<main>
<section class="hero"><div><div class="kicker">WORKSPACE</div><h1>Напоминания</h1><p>Простое веб-приложение для проверки интерфейса, API, базы данных и сохранения данных.</p></div>
<button class="add" onclick="openForm()">＋ Новое напоминание</button></section>

<section class="stats"><div><b id="total">0</b><span>всего</span></div><div><b id="active">0</b><span>активных</span></div><div><b id="done">0</b><span>выполнено</span></div></section>
<section id="list" class="list"></section>
</main>

<div id="modal" class="modal hidden"><div class="card">
<button class="close" onclick="closeForm()">×</button><div class="kicker">NEW REMINDER</div><h2>Новое напоминание</h2>
<label>Название<input id="title" placeholder="Например, проверить PySpace"></label>
<label>Дата и время<input id="when" type="datetime-local"></label>
<label>Заметка<textarea id="note" rows="4" placeholder="Дополнительная информация"></textarea></label>
<button class="add wide" onclick="createReminder()">Создать</button><div id="err"></div>
</div></div>
<script>
const $=x=>document.getElementById(x);
let items=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(){ $('modal').classList.remove('hidden'); $('title').focus() }
function closeForm(){ $('modal').classList.add('hidden'); $('err').textContent='' }
async function load(){
 const r=await fetch('/api/reminders'); items=await r.json();
 $('total').textContent=items.length;$('active').textContent=items.filter(x=>!x.done).length;$('done').textContent=items.filter(x=>x.done).length;
 $('list').innerHTML=items.length?items.map(x=>`<article class="item ${x.done?'completed':''}">
 <button class="check" onclick="toggle(${x.id})">${x.done?'✓':''}</button>
 <div class="body"><h3>${esc(x.title)}</h3><time>${new Date(x.remind_at).toLocaleString('ru-RU')}</time>${x.note?`<p>${esc(x.note)}</p>`:''}</div>
 <button class="delete" onclick="removeItem(${x.id})">Удалить</button></article>`).join(''):`<div class="empty"><div>◷</div><h2>Пока пусто</h2><p>Создайте первое напоминание.</p></div>`;
}
async function createReminder(){
 const title=$('title').value.trim(), when=$('when').value, note=$('note').value.trim();
 if(!title||!when){$('err').textContent='Заполните название и дату';return}
 const r=await fetch('/api/reminders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,remind_at:when,note})});
 if(!r.ok){let d=await r.json();$('err').textContent=d.error||'Ошибка';return}
 $('title').value='';$('note').value='';closeForm();load();
}
async function toggle(id){await fetch('/api/reminders/'+id,{method:'PATCH'});load()}
async function removeItem(id){if(confirm('Удалить напоминание?')){await fetch('/api/reminders/'+id,{method:'DELETE'});load()}}
function clock(){$('clock').textContent=new Date().toLocaleString('ru-RU',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
clock();setInterval(clock,30000);load();
</script></body></html>
