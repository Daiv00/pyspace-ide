<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PySpace Share</title><link rel="stylesheet" href="/static/style.css?v=4"></head><body class="share-page">
<div class="share-wrap"><div class="share-card"><div class="share-brand">◈ <b>PySpace</b> <span>LOCAL SHARE</span></div><h1>Общий локальный обмен</h1><p class="muted">Отправляйте файлы и текст на устройство, которое создало эту ссылку. Всё сохраняется в локальном хранилище.</p>
<div class="drop" id="drop">Перетащите файлы сюда или <label class="filepick">выберите файлы<input id="files" type="file" multiple></label></div>
<textarea id="text" rows="7" placeholder="Или вставьте сюда текст, сообщение, код..."></textarea><input id="textName" value="message.txt" placeholder="Имя текстового файла"><button class="primary" id="send">Отправить</button><div id="status" class="status"></div>
<h2>Файлы в хранилище</h2><div id="list" class="share-list">Загрузка...</div></div></div>
<script>const token={{ token|tojson }};const $=x=>document.getElementById(x);async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}function fmt(n){return n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(1)+' МБ'}async function load(){try{const d=await api('/api/local-share/'+token);$('list').innerHTML=d.files.length?d.files.map(f=>'<div class="share-file"><span>📄 '+f.path+' <small>'+fmt(f.size)+'</small></span><a href="/api/local-share/'+token+'/download/'+encodeURIComponent(f.path)">Скачать</a></div>').join(''):'<div class="muted">Пока файлов нет.</div>'}catch(e){$('list').textContent=e.message}}async function send(){const fs=[...$('files').files];const fd=new FormData();fs.forEach(f=>fd.append('files',f));const text=$('text').value;if(text.trim()){fd.append('text',text);fd.append('text_name',$('textName').value||'message.txt')}if(!fs.length&&!text.trim())return $('status').textContent='Выберите файл или введите текст.';$('send').disabled=true;$('status').textContent='Отправка...';try{const d=await api('/api/local-share/'+token+'/upload',{method:'POST',body:fd});$('status').textContent='✓ Отправлено: '+d.files.join(', ');$('files').value='';$('text').value='';await load()}catch(e){$('status').textContent='✕ '+e.message}finally{$('send').disabled=false}}$('send').onclick=send;load();</script></body></html>
