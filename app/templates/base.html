<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}PySpace IDE{% endblock %}</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v={{ asset_version }}">
  {% block head %}{% endblock %}
  <script>
    // Тема применяется до первой отрисовки, чтобы не мигало.
    (function () {
      try {
        var stored = localStorage.getItem('pyspace.theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) { /* приватный режим */ }
    })();
  </script>
</head>
<body{% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
{% block scripts %}{% endblock %}
</body>
</html>
